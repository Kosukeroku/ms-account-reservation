spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}

  liquibase:
    change-log: ${LIQUIBASE_CHANGELOG}
    enabled: ${LIQUIBASE_ENABLED}

  cache:
    type: redis
    redis:
      time-to-live: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:5000}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "ClientChangedEvent:kosukeroku.ms_account_reservation.kafka.event.ClientChangedEvent"
    listener:
      ack-mode: manual
      retry:
        max-attempts: 3
        initial-interval: 1000
        multiplier: 2.0

server:
  port: ${PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8083}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    kafka:
      enabled: true

app:
  currency-client:
    api-key: ${CURRENCY_CLIENT_API_KEY}
    base-url: ${CURRENCY_CLIENT_BASE_URL}
    connect-timeout: ${CURRENCY_CLIENT_CONNECT_TIMEOUT}
    read-timeout: ${CURRENCY_CLIENT_READ_TIMEOUT}
    retry-attempts: ${CURRENCY_CLIENT_RETRY_ATTEMPTS:3}
    retry-delay: ${CURRENCY_CLIENT_RETRY_DELAY:1000}
    retry-multiplier: ${CURRENCY_CLIENT_RETRY_MULTIPLIER:2}
    health-indicator:
      enabled: ${HEALTH_INDICATOR_ENABLED:true}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:5}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:10}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:100}
    thread-name-prefix: ${APP_ASYNC_THREAD_NAME_PREFIX:async-}
    timeout-seconds: ${APP_ASYNC_TIMEOUT_SECONDS:5}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  enabled: ${KAFKA_ENABLED:true}
  topic:
    name: ${KAFKA_TOPIC_NAME:client-events}
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
    enabled: ${KAFKA_TOPIC_ENABLED:true}
  consumer:
    enabled: ${KAFKA_CONSUMER_ENABLED:true}
    group-id: ${KAFKA_CONSUMER_GROUP:client-events-group}
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
    max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}
  producer:
    enabled: ${KAFKA_PRODUCER_ENABLED:true}
    acks: ${KAFKA_PRODUCER_ACKS:all}
    retries: ${KAFKA_PRODUCER_RETRIES:3}

logging:
  level:
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER:INFO}