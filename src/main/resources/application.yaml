spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}

  liquibase:
    change-log: ${LIQUIBASE_CHANGELOG}
    enabled: ${LIQUIBASE_ENABLED}

  cache:
    type: redis
    redis:
      time-to-live: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:5000}


server:
  port: ${PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8083}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    kafka:
      enabled: true

app:
  currency-client:
    api-key: ${CURRENCY_CLIENT_API_KEY}
    base-url: ${CURRENCY_CLIENT_BASE_URL}
    connect-timeout: ${CURRENCY_CLIENT_CONNECT_TIMEOUT}
    read-timeout: ${CURRENCY_CLIENT_READ_TIMEOUT}
    retry-attempts: ${CURRENCY_CLIENT_RETRY_ATTEMPTS:3}
    retry-delay: ${CURRENCY_CLIENT_RETRY_DELAY:1000}
    retry-multiplier: ${CURRENCY_CLIENT_RETRY_MULTIPLIER:2}
    health-indicator:
      enabled: ${HEALTH_INDICATOR_ENABLED:true}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:5}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:10}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:100}
    thread-name-prefix: ${APP_ASYNC_THREAD_NAME_PREFIX:async-}
    timeout-seconds: ${APP_ASYNC_TIMEOUT_SECONDS:5}

client-events:
  kafka:
    bootstrap-servers: ${CLIENT_EVENTS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic:
      name: ${CLIENT_EVENTS_KAFKA_TOPIC_NAME:client-events}
    producer:
      enabled: ${CLIENT_EVENTS_KAFKA_PRODUCER_ENABLED:true}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${CLIENT_EVENTS_KAFKA_PRODUCER_ACKS:all}
      retries: ${CLIENT_EVENTS_KAFKA_PRODUCER_RETRIES:3}
    consumer:
      enabled: ${CLIENT_EVENTS_KAFKA_CONSUMER_ENABLED:true}
      group-id: ${CLIENT_EVENTS_KAFKA_CONSUMER_GROUP:client-events-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: ${CLIENT_EVENTS_KAFKA_CONSUMER_MAX_POLL_RECORDS:500}
      auto-offset-reset: ${CLIENT_EVENTS_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: ${CLIENT_EVENTS_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "ClientChangedEvent:kosukeroku.ms_account_reservation.kafka.event.ClientChangedEvent"
    listener:
      ack-mode: manual
      concurrency: ${CLIENT_EVENTS_KAFKA_LISTENER_CONCURRENCY:3}

logging:
  level:
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER:INFO}