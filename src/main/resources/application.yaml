spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}

  liquibase:
    change-log: ${LIQUIBASE_CHANGELOG}
    enabled: ${LIQUIBASE_ENABLED}

server:
  port: ${PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8083}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,threaddump}
  endpoint:
    shutdown:
      access: ${SHUTDOWN_ACCESS:none}