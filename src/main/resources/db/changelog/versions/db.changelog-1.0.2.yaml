databaseChangeLog:
  - changeSet:
      id: 6
      author: kosukeroku
      changes:
        - dropTable:
            tableName: client
            cascadeConstraints: true

        - createTable:
            tableName: client
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mdm_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR
              - column:
                  name: last_name
                  type: VARCHAR
              - column:
                  name: middle_name
                  type: VARCHAR
              - column:
                  name: citizenship
                  type: VARCHAR
              - column:
                  name: client_type
                  type: VARCHAR
              - column:
                  name: document_number
                  type: VARCHAR
              - column:
                  name: document_series
                  type: VARCHAR
              - column:
                  name: document_type
                  type: VARCHAR
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false