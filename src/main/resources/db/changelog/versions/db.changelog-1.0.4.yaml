databaseChangeLog:
  - changeSet:
      id: 10
      author: kosukeroku
      changes:
        - createTable:
            tableName: idempotent_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: VARCHAR(100)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: client_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(20)
              - column:
                  name: processed_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP