databaseChangeLog:
  - changeSet:
      id: 7
      author: kosukeroku
      changes:
        - addColumn:
            tableName: account
            columns:
              - column:
                  name: balance
                  type: DECIMAL(19, 2)
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(50)
                  constraints:
                    unique: true
  - changeSet:
      id: 8
      author: kosukeroku
      changes:
        - sql:
            sql: |
              UPDATE account SET account_number = gen_random_uuid()::VARCHAR WHERE account_number IS NULL;
  - changeSet:
      id: 9
      author: kosukeroku
      changes:
        - addNotNullConstraint:
            tableName: account
            columnName: account_number
            columnDataType: VARCHAR(50)